name: Validate VCU100 catalog and published packages

on:
  push:
    branches: [main]
    paths:
      - "v2/catalog.json"
      - "v2/vcu100/**"
      - "scripts/validate_vcu100_catalog.py"
      - ".github/workflows/validate-vcu100.yml"
  pull_request:
    paths:
      - "v2/catalog.json"
      - "v2/vcu100/**"
      - "scripts/validate_vcu100_catalog.py"
      - ".github/workflows/validate-vcu100.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check published SHA-256, bytes, IDs, dependency senses and schema
        run: python scripts/validate_vcu100_catalog.py
