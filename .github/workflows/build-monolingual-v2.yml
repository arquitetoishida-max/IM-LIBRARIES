name: Build unified monolingual V2 catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build_monolingual_v2.py
      - .github/workflows/build-monolingual-v2.yml
      - master/en-master-v1.json
      - languages/pt-BR.json
      - languages/ja.json
permissions:
  contents: write
concurrency:
  group: monolingual-v2
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_monolingual_v2.py
      - name: Commit packages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add v2/
          if ! git diff --cached --quiet; then
            git commit -m "Publish unified monolingual V2 discovery catalog"
            git pull --rebase origin main
            git push
          fi
