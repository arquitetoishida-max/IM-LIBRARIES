name: Editorial QA (ja readings)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['curation/editorial/**', 'v2/zh-core-v2.json', 'scripts/verify_editorial.py', 'scripts/build_editorial_core.py', '.github/workflows/editorial-check.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pykakasi pypinyin
      - name: Check readings
        run: python scripts/verify_editorial.py | while IFS= read -r l; do echo "::notice::$l"; done
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/EDITORIAL_QA.json
          git commit -qm "Editorial QA report [skip ci]" || exit 0
          git pull -q --rebase origin main && git push -q origin HEAD:main
