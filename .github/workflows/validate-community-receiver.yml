name: Validate community receiver
on:
  pull_request:
    paths:
      - community/**
      - .github/workflows/validate-community-receiver.yml
  push:
    branches: [main]
    paths:
      - community/**
      - .github/workflows/validate-community-receiver.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node community/receiver/test_receiver.cjs
